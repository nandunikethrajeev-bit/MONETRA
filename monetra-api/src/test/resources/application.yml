server:
  port: 8080

spring:
  application:
    name: monetra-api-test
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:monetratestdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

monetra:
  jwt:
    secret: monetra_test_secure_jwt_secret_key_1234567890_test_suite
    validity-seconds: 86400

logging:
  level:
    com.monetra: INFO
    org.flywaydb: INFO
